name: بناء التطبيق APK

on:
  push:
    branches: [main]
    paths-ignore: ["times.json", "mosques.json", "latest.json", "README.md", "signing/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - name: التحقق من كلمة سر التوقيع
        id: check
        run: |
          if [ -z "$KEY_PASS" ]; then
            echo "::warning::أضف السر KEYSTORE_PASSWORD في إعدادات المستودع ثم أعد التشغيل"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        if: steps.check.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 21

      # مفتاح واحد ثابت: يُنشأ مرة واحدة فقط ويُحفظ مشفّراً في المستودع،
      # ثم يُفكّ تشفيره في كل بناء حتى تُثبَّت التحديثات فوق النسخة القديمة.
      - name: مفتاح التوقيع
        if: steps.check.outputs.ok == 'true'
        run: |
          # أداة التوقيع تقبل الحروف الإنجليزية فقط، فنحوّل كلمة السر (بأي لغة) إلى رمز ثابت منها
          STORE_PASS=$(printf '%s' "$KEY_PASS" | sha256sum | cut -c1-40)
          echo "::add-mask::$STORE_PASS"
          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          export STORE_PASS
          if [ -f signing/release.keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in signing/release.keystore.enc -out android/app/release.keystore -pass env:STORE_PASS
          else
            keytool -genkeypair -keystore android/app/release.keystore -alias iqama \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass:env STORE_PASS -keypass:env STORE_PASS -dname "CN=Masjid Iqama, C=MR"
            mkdir -p signing
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
              -in android/app/release.keystore -out signing/release.keystore.enc -pass env:STORE_PASS
            echo "NEW_KEY=1" >> "$GITHUB_ENV"
          fi

      - name: تثبيت الحزم
        if: steps.check.outputs.ok == 'true'
        run: npm ci

      - name: كتابة رقم النسخة داخل التطبيق
        if: steps.check.outputs.ok == 'true'
        run: |
          echo "{\"version\": ${{ github.run_number }}, \"native\": $(cat NATIVE_LEVEL)}" > www/version.json

      - name: نسخ صفحة التطبيق إلى أندرويد
        if: steps.check.outputs.ok == 'true'
        run: npx cap sync android

      - name: بناء APK
        if: steps.check.outputs.ok == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../masjid-iqama.apk
          # ملف الواجهة للتحديث التلقائي؛ رقم n في الاسم = مستوى النظام الداخلي الذي يحتاجه
          cd ../www && zip -qr "../web-n$(cat ../NATIVE_LEVEL).zip" . && cd ..

      - name: حفظ المفتاح المشفّر (أول مرة فقط)
        if: steps.check.outputs.ok == 'true' && env.NEW_KEY == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/release.keystore.enc
          git commit -m "حفظ مفتاح التوقيع المشفّر"
          git push

      - name: نشر النسخة في صفحة Releases
        if: steps.check.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: النسخة ${{ github.run_number }}
          body: حمّل ملف masjid-iqama.apk وثبّته على جوال أندرويد.
          files: |
            masjid-iqama.apk
            web-n*.zip
          make_latest: true

      # ملف صغير بآخر نسخة يقرؤه التطبيق للتحديث التلقائي (من نفس عنوان قائمة المساجد)
      - name: تحديث latest.json
        if: steps.check.outputs.ok == 'true'
        run: |
          N=$(cat NATIVE_LEVEL); V=${{ github.run_number }}
          R="https://github.com/${{ github.repository }}/releases/download/v$V"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # نبدأ كل محاولة من آخر نسخة على GitHub (البناء انتهى، فلا نحتاج ملفاته المحلية)،
          # ولا نكتب إلا إذا كان رقمنا أكبر من المنشور، فلا يتعارض بناءان متقاربان
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            CUR=$(python3 -c "import json;print(json.load(open('latest.json'))['version'])" 2>/dev/null || echo 0)
            if [ "$CUR" -ge "$V" ]; then echo "المنشور ($CUR) أحدث أو مساوٍ"; exit 0; fi
            echo "{\"version\": $V, \"native\": $N, \"web\": \"$R/web-n$N.zip\", \"apk\": \"$R/masjid-iqama.apk\"}" > latest.json
            cat latest.json
            git add latest.json && git commit -q -m "آخر نسخة: $V"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "::error::تعذّر نشر latest.json"; exit 1
