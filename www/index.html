<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أوقات الإقامة</title>
<style>
  :root { --bg:#0f2a24; --card:#163a32; --text:#f3efe2; --muted:#b9c4bd; --accent:#d4a84b; --on-accent:#1b1b1b; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
         padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  .wrap { max-width:520px; margin:0 auto; padding:10px 16px; }
  h1 { text-align:center; margin:4px 0 0; font-size:1.3rem; }
  .date { text-align:center; color:var(--muted); font-size:.85rem; }
  .clock { text-align:center; font-size:1.9rem; font-weight:bold; letter-spacing:1px; margin:2px 0; }
  .next { background:var(--accent); color:var(--on-accent); border-radius:12px; padding:8px 12px; text-align:center; margin:6px 0 8px; }
  .next b { font-size:1.1rem; }
  .countdown { font-size:1.6rem; font-weight:bold; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--card);
         border-radius:10px; padding:9px 14px; margin:6px 0; font-size:1.1rem; }
  .row.active { outline:2px solid var(--accent); }
  .note { text-align:center; color:var(--muted); font-size:.85rem; margin-top:8px; white-space:pre-line; }
  .clock, .countdown, .row span:last-child { font-variant-numeric:tabular-nums; }
  .settings { background:var(--card); border-radius:10px; margin-top:8px; }
  .settings summary { padding:10px 14px; cursor:pointer; color:var(--accent); font-size:.95rem; }
  .settings .body { display:grid; gap:12px; padding:0 14px 14px; }
  .settings label { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:1rem; }
  select { font-size:1rem; padding:6px; border-radius:8px; background:var(--text); color:var(--bg); border:none; }
  input[type=checkbox] { width:24px; height:24px; accent-color:var(--accent); }
  button { background:transparent; color:var(--accent); border:1px solid var(--accent); border-radius:8px; padding:8px 12px; font-size:.95rem; }
  .status { color:var(--muted); font-size:.9rem; line-height:1.6; }
  .updated { text-align:center; color:var(--muted); font-size:.75rem; margin-top:8px; }
  .adhkarBtn { display:block; width:100%; margin-top:8px; padding:11px 14px; font-size:1.05rem; background:var(--card); color:var(--accent); border:1px solid var(--accent); border-radius:10px; }
  #adhkarView { position:fixed; inset:0; background:var(--bg); overflow-y:auto; z-index:10;
                padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  .adhkarHead { position:sticky; top:0; background:var(--bg); display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--card); }
  .adhkarHead h2 { margin:0; font-size:1.2rem; color:var(--accent); }
  .adhkarHead small { color:var(--muted); }
  .dhikr { background:var(--card); border-radius:12px; padding:12px 14px; margin:10px 0; cursor:pointer; user-select:none; }
  .dhikr .top { display:flex; justify-content:space-between; align-items:center; color:var(--accent); font-size:.9rem; margin-bottom:4px; }
  .dhikr .left { border:1px solid var(--accent); border-radius:999px; padding:1px 10px; font-variant-numeric:tabular-nums; }
  .dhikr .txt { font-size:1.2rem; line-height:2; white-space:pre-line; }
  .dhikr .src { color:var(--muted); font-size:.8rem; margin-top:4px; }
  .dhikr.done { opacity:.45; }
  .dhikr.done .left { background:var(--accent); color:var(--on-accent); }
  .dhikr:active { outline:2px solid var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="name"></h1>
  <div class="date" id="date"></div>
  <div class="clock" id="clock"></div>
  <div class="next" id="next"></div>
  <div id="list"></div>
  <div class="note" id="note"></div>

  <button class="adhkarBtn" id="adhkarBtn">أذكار المساء</button>
  <details class="settings" id="settingsBox">
    <summary id="settingsSummary">⚙ إعدادات التنبيه</summary>
    <div class="body">
    <label for="notifyOn">تفعيل التنبيه
      <input type="checkbox" id="notifyOn">
    </label>
    <label for="minutes">قبل الإقامة بـ
      <select id="minutes">
        <option value="5">5 دقائق</option>
        <option value="10">10 دقائق</option>
        <option value="15">15 دقيقة</option>
        <option value="20">20 دقيقة</option>
        <option value="30">30 دقيقة</option>
      </select>
    </label>
    <div class="status" id="notifyStatus"></div>
    <button id="testBtn">جرّب التنبيه الآن (بعد 5 ثوانٍ)</button>
    <button id="exactBtn" hidden>اسمح بالتنبيه في الوقت الدقيق</button>
    </div>
  </details>
  <div class="updated" id="updated"></div>
</div>

<div id="adhkarView" hidden>
  <div class="adhkarHead">
    <button id="adhkarBack">رجوع</button>
    <div style="text-align:center"><h2>أذكار المساء</h2><small id="adhkarProgress"></small></div>
    <button id="adhkarReset">إعادة</button>
  </div>
  <div class="wrap" id="adhkarList"></div>
</div>

<script src="capacitor.js"></script>
<script>
// ملف الأوقات على الإنترنت: عدّله ليتغيّر الوقت عند كل من ثبّت التطبيق
const TIMES_URL = "https://raw.githubusercontent.com/etsbinaa-dev/masjid-iqama/main/times.json";

// أوقات احتياطية تُستعمل إن لم يتوفر الإنترنت عند أول فتح
const DEFAULTS = {
  mosqueName: "مسجد الحي",
  note: "يرجى إغلاق الهاتف داخل المسجد",
  prayers: [
    { name: "الفجر",  iqama: "06:10" },
    { name: "الظهر",  iqama: "14:30" },
    { name: "العصر",  iqama: "17:00" },
    { name: "المغرب", iqama: "19:05" },
    { name: "العشاء", iqama: "20:30" }
  ],
  jumuah: "14:00"
};

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let cfg = store.get("times", DEFAULTS);
let settings = store.get("settings", { on: true, minutes: 10 });
let updatedAt = store.get("updatedAt", null);

const Notif = window.Capacitor && window.Capacitor.isNativePlatform()
  ? window.Capacitor.registerPlugin("LocalNotifications") : null;

// ---------- العرض ----------
function todayPrayers(now) {
  const list = cfg.prayers.map(p => ({ ...p }));
  if (now.getDay() === 5) list[1] = { name: "الجمعة", iqama: cfg.jumuah };
  return list;
}
function toDate(hhmm, base) {
  const [h, m] = hhmm.split(":").map(Number);
  const d = new Date(base); d.setHours(h, m, 0, 0); return d;
}
function fmt12(hhmm) {
  let [h, m] = hhmm.split(":").map(Number);
  const s = h < 12 ? "ص" : "م"; h = h % 12 || 12;
  return `${h}:${String(m).padStart(2, "0")} ${s}`;
}
function findNext(now) {
  const list = todayPrayers(now);
  for (let i = 0; i < list.length; i++) {
    const t = toDate(list[i].iqama, now);
    if (t > now) return { index: i, prayer: list[i], time: t };
  }
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
  const first = todayPrayers(tomorrow)[0];
  return { index: -1, prayer: first, time: toDate(first.iqama, tomorrow) };
}
function render() {
  const now = new Date();
  $("name").textContent = cfg.mosqueName;
  $("note").textContent = cfg.note || "";
  $("clock").textContent = now.toLocaleTimeString("ar-u-nu-latn", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const greg = now.toLocaleDateString("ar-u-nu-latn", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  let hijri = "";
  try { hijri = now.toLocaleDateString("ar-u-ca-islamic-umalqura-nu-latn", { day: "numeric", month: "long", year: "numeric" }); } catch {}
  $("date").textContent = hijri ? `${greg} · ${hijri}` : greg;

  const nx = findNext(now);
  const diff = Math.max(0, Math.floor((nx.time - now) / 1000));
  const h = Math.floor(diff / 3600), m = Math.floor(diff % 3600 / 60), s = diff % 60;
  $("next").innerHTML = `الإقامة القادمة: <b>${nx.prayer.name}</b> (${fmt12(nx.prayer.iqama)})
     <div class="countdown">${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}</div>`;
  $("list").innerHTML = todayPrayers(now).map((p, i) =>
    `<div class="row ${i === nx.index ? "active" : ""}"><span>${p.name}</span><span>${fmt12(p.iqama)}</span></div>`).join("");
}

// ---------- جلب الأوقات من الإنترنت ----------
function validTimes(t) {
  const ok = v => typeof v === "string" && /^\d{1,2}:\d{2}$/.test(v);
  return t && Array.isArray(t.prayers) && t.prayers.length === 5 && t.prayers.every(p => p.name && ok(p.iqama)) && ok(t.jumuah);
}
async function refreshTimes() {
  try {
    const res = await fetch(TIMES_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const t = await res.json();
    if (!validTimes(t)) return;
    const changed = JSON.stringify(t) !== JSON.stringify(cfg);
    cfg = t; store.set("times", cfg);
    updatedAt = new Date().toISOString(); store.set("updatedAt", updatedAt);
    showUpdated(); render();
    if (changed) scheduleAll();
  } catch {}
}
function showUpdated() {
  $("updated").textContent = updatedAt
    ? "آخر تحديث للأوقات: " + new Date(updatedAt).toLocaleString("ar-u-nu-latn", { dateStyle: "medium", timeStyle: "short" })
    : "";
}

// ---------- التنبيهات ----------
// وقت التنبيه = وقت الإقامة ناقص عدد الدقائق المختار
function minus(hhmm, mins) {
  const [h, m] = hhmm.split(":").map(Number);
  const t = ((h * 60 + m - mins) % 1440 + 1440) % 1440;
  return { hour: Math.floor(t / 60), minute: t % 60 };
}
function buildAlarms() {
  const n = settings.minutes;
  const items = [];
  const add = (id, name, iqama, weekday) => {
    const at = minus(iqama, n);
    items.push({
      id, hour: at.hour, minute: at.minute, weekday: weekday || 0,
      title: `إقامة ${name} بعد ${n} دقائق`,
      body: `${cfg.mosqueName} — الإقامة ${fmt12(iqama)}`
    });
  };
  const [fajr, dhuhr, asr, maghrib, isha] = cfg.prayers;
  add(1, fajr.name, fajr.iqama);
  add(3, asr.name, asr.iqama);
  add(4, maghrib.name, maghrib.iqama);
  add(5, isha.name, isha.iqama);
  // الظهر كل الأيام عدا الجمعة (1=الأحد ... 6=الجمعة، 7=السبت)
  [1, 2, 3, 4, 5, 7].forEach(d => add(20 + d, dhuhr.name, dhuhr.iqama, d));
  add(26, "الجمعة", cfg.jumuah, 6);
  return items;
}

// نظام التنبيه الخاص بالتطبيق (كود أندرويد): يشغّل "حي على الصلاة" على صوت المنبّه فيُسمع في الوضع الصامت.
const Alarm = Notif ? window.Capacitor.registerPlugin("IqamaAlarm") : null;

// تنظيف ما بقي من النسخ القديمة: تنبيهاتها المجدولة وقنواتها
async function cleanupOld() {
  try {
    const pending = await Notif.getPending();
    if (pending.notifications.length) {
      await Notif.cancel({ notifications: pending.notifications.map(x => ({ id: x.id })) });
    }
  } catch {}
  for (const old of ["iqama", "iqama_sound", "iqama_hayya", "iqama_alarm"]) {
    try { await Notif.deleteChannel({ id: old }); } catch {}
  }
}
async function askPermission() {
  let perm = await Notif.checkPermissions();
  if (perm.display !== "granted") perm = await Notif.requestPermissions();
  return perm.display === "granted";
}
async function scheduleAll() {
  if (!Alarm) { $("notifyStatus").textContent = "التنبيهات تعمل داخل تطبيق الجوال فقط."; return; }
  try {
    await cleanupOld();
    if (!settings.on) {
      await Alarm.cancelAll();
      $("notifyStatus").textContent = "التنبيه متوقف.";
      $("settingsSummary").textContent = "⚙ التنبيه متوقف";
      return;
    }
    // الصوت يعمل حتى دون إذن الإشعارات، لكن الإشعار المكتوب يحتاجه
    const granted = await askPermission();
    await Alarm.schedule({ alarms: buildAlarms() });
    if (granted) {
      $("notifyStatus").textContent = `سيرنّ التطبيق قبل كل إقامة بـ ${settings.minutes} دقائق، حتى في الوضع الصامت.`;
    } else {
      $("settingsBox").open = true;
      $("notifyStatus").textContent = "سيرنّ الصوت، لكن الإشعار المكتوب لن يظهر لأنك لم تسمح بالإشعارات. فعّلها من إعدادات الجوال ← التطبيقات ← أوقات الإقامة ← الإشعارات.";
    }
    $("settingsSummary").textContent = `⚙ التنبيه قبل الإقامة بـ ${settings.minutes} دقائق`;
    try {
      const exact = await Notif.checkExactNotificationSetting();
      $("exactBtn").hidden = exact.exact_alarm === "granted";
    } catch {}
  } catch (e) {
    $("notifyStatus").textContent = "تعذّر ضبط التنبيهات. أغلق التطبيق وافتحه مرة أخرى.";
  }
}

$("notifyOn").checked = settings.on;
$("minutes").value = String(settings.minutes);
$("notifyOn").onchange = e => { settings.on = e.target.checked; store.set("settings", settings); scheduleAll(); };
$("minutes").onchange = e => { settings.minutes = Number(e.target.value); store.set("settings", settings); scheduleAll(); };
$("testBtn").onclick = async () => {
  if (!Alarm) { $("notifyStatus").textContent = "التجربة تعمل داخل تطبيق الجوال فقط."; return; }
  try {
    await askPermission();
    await Alarm.test({ seconds: 5, title: "تجربة التنبيه", body: "هكذا سيصلك التنبيه قبل الإقامة" });
    $("notifyStatus").textContent = "سيرنّ التنبيه بعد 5 ثوانٍ على صوت المنبّه، حتى لو كان الجوال صامتاً. إن لم تسمعه ارفع صوت المنبّه.";
  } catch {
    $("notifyStatus").textContent = "تعذّرت التجربة. أغلق التطبيق وافتحه مرة أخرى.";
  }
};
$("exactBtn").onclick = async () => {
  try { await Notif.changeExactNotificationSetting(); } catch {}
  scheduleAll();
};

// ---------- أذكار المساء ----------
// اضغط على الذكر ليُنقص العدد حتى يكتمل. التقدّم يُحفظ لليوم نفسه ويبدأ من جديد في اليوم التالي.
let adhkar = [];
const todayKey = () => new Date().toDateString();
function loadDone() {
  const saved = store.get("adhkarDone", null);
  return saved && saved.day === todayKey() ? saved.counts : {};
}
let done = loadDone();
function saveDone() { store.set("adhkarDone", { day: todayKey(), counts: done }); }
function renderAdhkar() {
  if (store.get("adhkarDone", {}).day !== todayKey()) done = {};
  let finished = 0;
  $("adhkarList").innerHTML = adhkar.map((d, i) => {
    const c = Math.min(done[i] || 0, d.n);
    const left = d.n - c;
    if (!left) finished++;
    const label = left ? (d.n > 1 ? `متبقي ${left}` : "مرة") : "✓";
    return `<div class="dhikr ${left ? "" : "done"}" data-i="${i}">
      <div class="top"><span>${i + 1}${d.t ? " · " + d.t : ""}</span><span class="left">${label}</span></div>
      <div class="txt"></div>${d.s ? `<div class="src">${d.s}</div>` : ""}</div>`;
  }).join("");
  // النص يوضع كنص عادي (لا HTML)
  $("adhkarList").querySelectorAll(".dhikr").forEach(el => { el.querySelector(".txt").textContent = adhkar[+el.dataset.i].x; });
  $("adhkarProgress").textContent = adhkar.length ? `${finished} من ${adhkar.length}` : "";
}
$("adhkarList").addEventListener("click", e => {
  const el = e.target.closest(".dhikr"); if (!el) return;
  const i = +el.dataset.i, d = adhkar[i];
  if ((done[i] || 0) >= d.n) return;
  done[i] = (done[i] || 0) + 1; saveDone(); renderAdhkar();
  try { navigator.vibrate && navigator.vibrate(done[i] >= d.n ? 60 : 15); } catch {}
});
async function openAdhkar() {
  if (!adhkar.length) {
    try { adhkar = await (await fetch("adhkar.json")).json(); } catch { adhkar = []; }
  }
  renderAdhkar();
  $("adhkarView").hidden = false;
  $("adhkarView").scrollTop = 0;
  history.pushState({ adhkar: true }, "");
}
function closeAdhkar() { $("adhkarView").hidden = true; }
$("adhkarBtn").onclick = openAdhkar;
$("adhkarBack").onclick = () => history.back();
// زر الرجوع في الجوال يغلق صفحة الأذكار بدل إغلاق التطبيق
window.addEventListener("popstate", closeAdhkar);
$("adhkarReset").onclick = () => { done = {}; saveDone(); renderAdhkar(); };

showUpdated();
render();
setInterval(render, 1000);
scheduleAll();
refreshTimes();
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshTimes(); });
</script>
</body>
</html>
