<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أوقات الإقامة</title>
<style>
  /* خط أميري (رخصة OFL) مضمّن في التطبيق لنصوص القرآن والأذكار */
  @font-face { font-family:"Amiri"; font-weight:400; font-display:swap; src:url("fonts/amiri-400.woff2") format("woff2"); }
  @font-face { font-family:"AmiriQuran"; font-display:swap; src:url("fonts/amiri-quran.woff2") format("woff2"); }
  @font-face { font-family:"Warsh"; font-display:swap; src:url("fonts/warsh.woff2") format("woff2"); }
  @font-face { font-family:"Amiri"; font-weight:700; font-display:swap; src:url("fonts/amiri-700.woff2") format("woff2"); }
  :root { --bg:#0f2a24; --card:#163a32; --card2:#1d4a40; --line:rgba(212,168,75,.35); --hair:rgba(243,239,226,.08); --text:#f3efe2; --muted:#b9c4bd; --accent:#d4a84b; --on-accent:#1b1b1b; color-scheme:dark; }
  /* الوضع الفاتح (اختياري من الإعدادات): نفس الهوية، بأرضية فاتحة وذهبي أغمق ليبقى مقروءاً */
  :root[data-theme="light"] { --bg:#f4f2ec; --card:#ffffff; --card2:#e9f1ec; --line:rgba(150,108,24,.45); --hair:rgba(15,42,36,.10);
    --text:#14302a; --muted:#5b6d66; --accent:#9a6f17; --on-accent:#ffffff; color-scheme:light; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
         padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  /* الشاشة الرئيسية: هادئة، بطاقة للإقامة القادمة، وقائمة واحدة للصلوات */
  .wrap { max-width:520px; margin:0 auto; padding:14px 18px 18px; display:flex; flex-direction:column; gap:14px; }
  .top { text-align:center; display:flex; flex-direction:column; gap:2px; }
  h1 { margin:0; font-family:"Amiri",serif; font-size:1.7rem; font-weight:700; line-height:1.4; }
  .where { color:var(--muted); font-size:.85rem; }
  .date { color:var(--muted); font-size:.8rem; opacity:.85; }
  .next { border-radius:20px; padding:18px 16px 16px; text-align:center;
          background:linear-gradient(160deg, var(--card2), var(--card)); border:1px solid var(--line); }
  .next .lbl { color:var(--muted); font-size:.85rem; }
  .next .pr { font-family:"Amiri",serif; font-size:2.6rem; font-weight:700; color:var(--accent); line-height:1.3; }
  .next .tm { font-size:1.7rem; font-weight:600; font-variant-numeric:tabular-nums; }
  .next .in { color:var(--muted); font-size:.95rem; margin-top:4px; }
  #list { background:var(--card); border-radius:18px; padding:4px 0; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:12px 18px; font-size:1.1rem; }
  .row + .row { border-top:1px solid var(--hair); }
  .row .t { font-variant-numeric:tabular-nums; }
  .row.past { opacity:.45; }
  .row.active { color:var(--accent); font-weight:700; }
  .row.active .n::before { content:"●"; font-size:.6em; margin-inline-end:8px; vertical-align:middle; }
  .nearBtn { display:flex; align-items:center; gap:12px; width:100%; background:var(--card); border:1px solid var(--hair);
             border-radius:16px; padding:12px 16px; color:var(--text); text-align:start; }
  .nearBtn:active { border-color:var(--accent); }
  .nearBtn .ic { font-size:1.5rem; }
  .nearBtn .tx { flex:1; min-width:0; display:flex; flex-direction:column; }
  .nearBtn small { color:var(--muted); font-size:.75rem; }
  .nearBtn b { font-size:1.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nearBtn .go { color:var(--accent); font-weight:700; white-space:nowrap; }
  .note { color:var(--muted); font-size:.8rem; white-space:pre-line; }
  .note:empty { display:none; }
  .settings { background:transparent; border-radius:14px; border:1px solid var(--hair); }
  .settings summary { padding:10px 14px; cursor:pointer; color:var(--accent); font-size:.95rem; }
  .settings .body { display:grid; gap:12px; padding:0 14px 14px; }
  .settings label { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:1rem; }
  select { font-size:1rem; padding:6px; border-radius:8px; background:var(--text); color:var(--bg); border:none; }
  input[type=checkbox] { width:24px; height:24px; accent-color:var(--accent); }
  button { background:transparent; color:var(--accent); border:1px solid var(--accent); border-radius:8px; padding:8px 12px; font-size:.95rem; }
  .status { color:var(--muted); font-size:.9rem; line-height:1.6; }
  .updated { text-align:center; color:var(--muted); font-size:.7rem; opacity:.7; }
  .adhkarRow { display:flex; gap:10px; }
  .adhkarRow .adhkarBtn { flex:1; margin-top:0; padding:10px 6px; border:none; border-radius:14px; display:flex; flex-direction:column; gap:0; line-height:1.3; }
  .adhkarRow .adhkarBtn small { color:var(--muted); font-size:.75rem; }
  .adhkarRow .adhkarBtn span { font-family:"Amiri",serif; font-size:1.25rem; font-weight:700; }
  .adhkarBtn { display:block; width:100%; margin-top:8px; padding:11px 14px; font-size:1.05rem; background:var(--card); color:var(--accent); border:1px solid var(--accent); border-radius:10px; }
  #adhkarView { position:fixed; inset:0; background:var(--bg); overflow:hidden; z-index:10; display:flex; flex-direction:column;
                padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  .adhkarHead { position:sticky; top:0; background:var(--bg); display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--card); }
  .adhkarHead h2 { margin:0; font-size:1.2rem; color:var(--accent); }
  .adhkarHead small { color:var(--muted); }
  #adhkarView[hidden] { display:none; }
  .pager { flex:1; min-height:0; display:flex; flex-direction:column; gap:12px; padding:12px 16px; box-sizing:border-box; }
  .dhikr { flex:1; min-height:0; background:var(--card); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px;
           cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .dhead { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .dhikr .title { color:var(--accent); font-size:.95rem; }
  .zoom { display:flex; gap:6px; }
  .zoom button { width:40px; height:40px; padding:0; border-radius:50%; font-size:1.4rem; line-height:1; font-weight:700; }
  /* حجم واحد لكل الأذكار يغيّره المستخدم بزرّي + و − ، والنص الطويل يُمرَّر */
  .dhikr .txt { flex:1; min-height:0; overflow-y:auto; font-size:26px; line-height:2; font-family:"AmiriQuran","Amiri",serif; font-weight:400;
                text-align:center; display:flex; flex-direction:column; justify-content:safe center; }
  .counter { align-self:center; width:96px; height:96px; border-radius:50%; border:3px solid var(--accent); color:var(--accent);
             display:flex; flex-direction:column; align-items:center; justify-content:center; font-variant-numeric:tabular-nums; }
  .counter b { font-size:2rem; line-height:1; }
  .counter span { font-size:.75rem; }
  .dhikr.done .counter { background:var(--accent); color:var(--on-accent); }
  .dhikr:active .counter { transform:scale(.96); }
  .hint { text-align:center; color:var(--muted); font-size:.8rem; }
  .nav { display:flex; gap:10px; }
  .nav button { flex:1; padding:12px; font-size:1.05rem; }
  .nav button:disabled { opacity:.35; }
  .chipsLabel { font-size:.95rem; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips button { border-radius:999px; padding:6px 12px; font-size:.95rem; background:var(--accent); color:var(--on-accent); border:1px solid var(--accent); }
  .chips button.off { background:transparent; color:var(--muted); border-color:var(--muted); text-decoration:line-through; }
  /* الشاشات القصيرة: دائرة أصغر وإخفاء التلميح لإفساح المجال للنص */
  @media (max-height: 780px) {
    .counter { width:72px; height:72px; }
    .counter b { font-size:1.6rem; }
    .hint { display:none; }
    .pager { gap:8px; padding:8px 12px; }
    .dhikr { padding:12px; gap:6px; }
  }
  .dhikr .txt p { margin:0; }
  .dhikr .txt .lead { color:var(--accent); font-size:.82em; }
  .dhikr .txt .gap { height:.5em; }
  .dhikr .txt .an { color:var(--accent); }
  /* سورة الكهف برواية ورش: خط مجمع الملك فهد */
  #kahfView { position:fixed; inset:0; background:var(--bg); z-index:10; display:flex; flex-direction:column; }
  #kahfView[hidden] { display:none; }
  .kahfCard { flex:1; min-height:0; background:var(--card); border-radius:14px; padding:12px 16px; display:flex; flex-direction:column; gap:8px; }
  #kahfText { flex:1; min-height:0; overflow-y:auto; font-family:"Warsh",serif; font-size:26px; line-height:2.1; text-align:center; }
  #kahfText .basmala { color:var(--accent); margin-bottom:.3em; }
  .kahfBtn { margin-top:10px; }
  .mosqueSwitch { align-self:center; display:flex; align-items:center; gap:8px; background:none; border:none; color:var(--text);
                  padding:2px 14px; border-radius:999px; }
  .mosqueSwitch:active { background:var(--card); }
  .mosqueSwitch .chev { color:var(--accent); font-size:1.3rem; line-height:1; transform:translateY(-4px); }
  .updateBar { display:block; width:100%; background:var(--accent); color:var(--on-accent); border:none; border-radius:14px;
               padding:10px 14px; font-size:1rem; font-weight:700; text-align:center; }
  .updateBar[hidden] { display:none; }
  #sheet { position:fixed; inset:0; background:var(--bg); z-index:11; display:flex; flex-direction:column;
           padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  #sheet[hidden] { display:none; }
  #sheetBody { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
  .mrow { background:var(--card); border-radius:12px; padding:12px 14px; display:flex; align-items:center; gap:10px; cursor:pointer; }
  .mrow.sel { outline:2px solid var(--accent); }
  .mrow .info { flex:1; min-width:0; }
  .mrow .nm { font-size:1.1rem; }
  .mrow .sub { color:var(--muted); font-size:.8rem; margin-top:2px; }
  .mrow .tag { color:var(--accent); font-size:.75rem; border:1px solid var(--accent); border-radius:999px; padding:0 8px; margin-inline-start:6px; }
  .mrow .edit { padding:6px 10px; font-size:.9rem; white-space:nowrap; }
  .bigBtn { width:100%; padding:12px; font-size:1.05rem; }
  .form label { display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--card); border-radius:10px; padding:10px 14px; font-size:1.05rem; }
  .form input { font-size:1.05rem; padding:6px; border-radius:8px; border:none; background:var(--text); color:var(--bg); }
  .form input[type=text] { width:60%; }
  .form .msg { color:var(--muted); font-size:.9rem; text-align:center; }
  .danger { color:#e08a7a; border-color:#e08a7a; }
  :root[data-theme="light"] select, :root[data-theme="light"] .form input { background:#edf1ec; color:var(--text); border:1px solid var(--hair); }
  :root[data-theme="light"] .danger { color:#b3442f; border-color:#b3442f; }
  .prRows { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .prRows label { background:var(--bg); border-radius:10px; padding:6px 10px; }
  .prRows select { font-size:.9rem; padding:4px; }
  .hint2 { color:var(--muted); font-size:.8rem; margin-top:-6px; }
  .shareBtn { background:none; border:none; color:var(--accent); font-size:.9rem; padding:4px; }
</style>
</head>
<body>
<div class="wrap">
  <button class="updateBar" id="updateBar" hidden></button>
  <div class="top">
    <button class="mosqueSwitch" id="mosquesBtn" aria-label="تغيير المسجد"><h1 id="name"></h1><span class="chev">⌄</span></button>
    <div class="where"><span id="whereText"></span></div>
    <div class="date" id="date"></div>
  </div>
  <div class="next" id="next"></div>
  <button class="nearBtn" id="nearBtn">
    <span class="ic">🧭</span>
    <span class="tx"><small>أقرب مسجد إليك الآن</small><b id="nearName">جارٍ تحديد موقعك…</b></span>
    <span class="go" id="nearGo">الطريق ‹</span>
  </button>
  <div id="list"></div>
  <div class="note" id="note"></div>
  <button class="shareBtn" id="shareMain">📤 مشاركة أوقات هذا المسجد</button>

  <div class="adhkarRow">
    <button class="adhkarBtn" data-sec="morning"><small>أذكار</small><span>الصباح</span></button>
    <button class="adhkarBtn" data-sec="evening"><small>أذكار</small><span>المساء</span></button>
    <button class="adhkarBtn" data-sec="sleep"><small>أذكار</small><span>النوم</span></button>
  </div>
  <button class="adhkarBtn kahfBtn" id="kahfOpen">📖 سورة الكهف · رواية ورش</button>
  <details class="settings" id="settingsBox">
    <summary id="settingsSummary">⚙ الإعدادات</summary>
    <div class="body">
    <label for="notifyOn">تفعيل التنبيه
      <input type="checkbox" id="notifyOn">
    </label>
    <div class="chipsLabel">التنبيه قبل كل إقامة:</div>
    <div class="prRows" id="prayerRows"></div>
    <label for="adhkarRemind">تذكير بأذكار الصباح والمساء
      <input type="checkbox" id="adhkarRemind">
    </label>
    <div class="hint2">بعد إقامة الفجر والعصر بنصف ساعة، بإشعار عادي دون أذان. الضغط عليه يفتح الأذكار.</div>
    <label for="hijriAdj">تصحيح التاريخ الهجري
      <select id="hijriAdj">
        <option value="-1">ناقص يوم</option>
        <option value="0">كما هو</option>
        <option value="1">زائد يوم</option>
      </select>
    </label>
    <label for="soundSel">صوت التنبيه
      <select id="soundSel">
        <option value="hayya">حي على الصلاة</option>
        <option value="chime">جرس هادئ</option>
        <option value="vibrate">اهتزاز فقط</option>
      </select>
    </label>
    <label for="fridayRemind">تذكير الجمعة (الكهف والصلاة على النبي ﷺ)
      <input type="checkbox" id="fridayRemind">
    </label>
    <label for="fontSel">حجم الخط
      <select id="fontSel">
        <option value="15">صغير</option>
        <option value="16">عادي</option>
        <option value="18">كبير</option>
        <option value="20">كبير جداً</option>
      </select>
    </label>
    <label for="themeSel">المظهر
      <select id="themeSel">
        <option value="dark">داكن</option>
        <option value="light">فاتح</option>
        <option value="auto">حسب الجوال</option>
      </select>
    </label>
    <div class="status" id="notifyStatus"></div>
    <button id="exactBtn" hidden>اسمح بالتنبيه في الوقت الدقيق</button>
    </div>
  </details>
  <div class="updated" id="updated"></div>
  <div class="updated" id="version"></div>
  <div class="updated" id="otaStatus"></div>
</div>

<div id="sheet" hidden>
  <div class="adhkarHead">
    <button id="sheetBack">رجوع</button>
    <h2 id="sheetTitle">المساجد</h2>
    <span style="width:52px"></span>
  </div>
  <div id="sheetBody"></div>
</div>

<div id="adhkarView" hidden>
  <div class="adhkarHead">
    <button id="adhkarBack">رجوع</button>
    <div style="text-align:center"><h2 id="adhkarTitle">أذكار المساء</h2><small id="adhkarProgress"></small></div>
    <button id="adhkarReset">إعادة</button>
  </div>
  <div class="pager">
    <div class="dhikr" id="dhikrCard">
      <div class="dhead">
        <div class="title" id="dhikrTitle"></div>
        <div class="zoom"><button id="zoomOut" aria-label="تصغير الخط">−</button><button id="zoomIn" aria-label="تكبير الخط">+</button></div>
      </div>
      <div class="txt" id="dhikrText"></div>
      <div class="counter" id="dhikrCounter"><b id="dhikrLeft"></b><span id="dhikrLabel"></span></div>
      <div class="hint">اضغط على الذكر للعدّ</div>
    </div>
    <div class="nav">
      <button id="dhikrPrev">السابق</button>
      <button id="dhikrNext">التالي</button>
    </div>
  </div>
</div>

<div id="kahfView" hidden>
  <div class="adhkarHead">
    <button id="kahfBack">رجوع</button>
    <div style="text-align:center"><h2>سورة الكهف</h2><small>رواية ورش عن نافع</small></div>
    <span style="width:52px"></span>
  </div>
  <div class="pager">
    <div class="kahfCard" id="kahfCard">
      <div class="dhead">
        <div class="title" id="kahfPage"></div>
        <div class="zoom"><button id="kZoomOut" aria-label="تصغير الخط">−</button><button id="kZoomIn" aria-label="تكبير الخط">+</button></div>
      </div>
      <div id="kahfText"></div>
    </div>
    <div class="nav">
      <button id="kahfPrev">السابق</button>
      <button id="kahfNext">التالي</button>
    </div>
  </div>
</div>

<script src="capacitor.js"></script>
<script>
// قائمة المساجد على الإنترنت: تُعدَّل في المستودع فتصل لكل من ثبّت التطبيق
const MOSQUES_URL = "https://raw.githubusercontent.com/etsbinaa-dev/masjid-iqama/main/mosques.json";
// قاعدة بيانات المساجد (Supabase). المفتاح "publishable" عام بطبيعته، والحماية في صلاحيات الجداول (RLS).
const SUPA_URL = "https://xarwvqfnhzwyemdnoucx.supabase.co";
const SUPA_KEY = "sb_publishable_zxZR8cXEGgpC50WGIgr4gw_EgGWnyN-";
const PRAYER_LABELS = ["الفجر", "الظهر", "العصر", "المغرب", "العشاء"];

// قائمة احتياطية تُستعمل إن لم يتوفر الإنترنت عند أول فتح
const DEFAULT_MOSQUES = [{
  id: "hay", name: "مسجد الفرقان", lat: 18.130300, lng: -15.954890, note: "يرجى إغلاق الهاتف داخل المسجد",
  prayers: [
    { name: "الفجر",  iqama: "06:10" },
    { name: "الظهر",  iqama: "14:30" },
    { name: "العصر",  iqama: "17:00" },
    { name: "المغرب", iqama: "18:50" },
    { name: "العشاء", iqama: "20:30" }
  ],
  jumuah: "14:00"
}];

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// cfg = المسجد المختار الآن (أقرب مسجد أو المختار يدوياً) بالصيغة التي تستعملها الشاشة والتنبيهات
let cfg = null;
let settings = store.get("settings", { on: true, minutes: 10 });
// تنبيه كل صلاة على حدة (كلها مفعّلة افتراضياً)
const PRAYER_KEYS = ["fajr", "dhuhr", "asr", "maghrib", "isha", "jumuah"];
const PRAYER_NAMES = { fajr: "الفجر", dhuhr: "الظهر", asr: "العصر", maghrib: "المغرب", isha: "العشاء", jumuah: "الجمعة" };
settings.prayers = Object.assign(Object.fromEntries(PRAYER_KEYS.map(k => [k, true])), settings.prayers || {});
// دقائق التنبيه لكل صلاة (تبدأ من الإعداد العام القديم)
settings.perMin = Object.assign(Object.fromEntries(PRAYER_KEYS.map(k => [k, settings.minutes || 10])), settings.perMin || {});
if (settings.adhkarRemind === undefined) settings.adhkarRemind = true;
if (settings.hijriAdj === undefined) settings.hijriAdj = 0;
if (!settings.sound) settings.sound = "hayya";
if (settings.fridayRemind === undefined) settings.fridayRemind = true;
if (!settings.fontPx) settings.fontPx = 16;
if (!settings.theme) settings.theme = "dark";
// حجم الخط والمظهر يُطبَّقان فوراً قبل أول رسم
function applyLook() {
  document.documentElement.style.fontSize = settings.fontPx + "px";
  const sysLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
  const light = settings.theme === "light" || (settings.theme === "auto" && sysLight);
  document.documentElement.dataset.theme = light ? "light" : "dark";
}
applyLook();
try { window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyLook); } catch {}
let updatedAt = store.get("updatedAt", null);

const Notif = window.Capacitor && window.Capacitor.isNativePlatform()
  ? window.Capacitor.registerPlugin("LocalNotifications") : null;

// ---------- العرض ----------
function todayPrayers(now) {
  const list = cfg.prayers.map(p => ({ ...p }));
  if (now.getDay() === 5) list[1] = { name: "الجمعة", iqama: cfg.jumuah };
  return list;
}
function toDate(hhmm, base) {
  const [h, m] = hhmm.split(":").map(Number);
  const d = new Date(base); d.setHours(h, m, 0, 0); return d;
}
function fmt12(hhmm) {
  let [h, m] = hhmm.split(":").map(Number);
  const s = h < 12 ? "ص" : "م"; h = h % 12 || 12;
  return `${h}:${String(m).padStart(2, "0")} ${s}`;
}
function findNext(now) {
  const list = todayPrayers(now);
  for (let i = 0; i < list.length; i++) {
    const t = toDate(list[i].iqama, now);
    if (t > now) return { index: i, prayer: list[i], time: t };
  }
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
  const first = todayPrayers(tomorrow)[0];
  return { index: -1, prayer: first, time: toDate(first.iqama, tomorrow) };
}
// المدة المتبقية بالعربية: "بعد ساعة و21 دقيقة"
function arDuration(totalMin) {
  const h = Math.floor(totalMin / 60), m = totalMin % 60;
  const mins = m === 1 ? "دقيقة" : m === 2 ? "دقيقتين" : m <= 10 ? `${m} دقائق` : `${m} دقيقة`;
  const hrs = h === 1 ? "ساعة" : h === 2 ? "ساعتين" : h <= 10 ? `${h} ساعات` : `${h} ساعة`;
  if (h === 0) return m === 0 ? "الآن" : `بعد ${mins}`;
  return m === 0 ? `بعد ${hrs}` : `بعد ${hrs} و${mins}`;
}
function render() {
  const now = new Date();
  $("name").textContent = cfg.mosqueName;
  $("note").textContent = cfg.note || "";
  const greg = now.toLocaleDateString("ar-u-nu-latn", { weekday: "long", day: "numeric", month: "long" });
  let hijri = "";
  try {
    const hd = new Date(now.getTime() + (settings.hijriAdj || 0) * 86400000);   // تصحيح رؤية الهلال
    hijri = hd.toLocaleDateString("ar-u-ca-islamic-umalqura-nu-latn", { day: "numeric", month: "long", year: "numeric" });
  } catch {}
  $("date").textContent = hijri ? `${greg} · ${hijri}` : greg;

  const nx = findNext(now);
  const mins = Math.max(0, Math.ceil((nx.time - now) / 60000));
  $("next").innerHTML = `<div class="lbl">الإقامة القادمة</div>
    <div class="pr">${nx.prayer.name}</div>
    <div class="tm">${fmt12(nx.prayer.iqama)}</div>
    <div class="in">${arDuration(mins)}</div>`;
  $("list").innerHTML = todayPrayers(now).map((p, i) => {
    // بعد العشاء: الإقامة القادمة هي فجر الغد، فنميّز الفجر بدل تبهيت كل الصلوات
    const nextIdx = nx.index === -1 ? 0 : nx.index;
    const cls = i === nextIdx ? "active" : (nx.index !== -1 && i < nx.index ? "past" : "");
    return `<div class="row ${cls}"><span class="n">${p.name}</span><span class="t">${fmt12(p.iqama)}</span></div>`;
  }).join("");
}

// ---------- المساجد ----------
// baseMosques: القائمة المشتركة. myMosques: مساجد أضافها صاحب الجوال. overrides: أوقات عدّلها على جواله فقط.
let baseMosques = store.get("mosques", DEFAULT_MOSQUES);
let myMosques = store.get("myMosques", []);
let overrides = store.get("overrides", {});
let choice = store.get("mosqueChoice", { mode: "auto" });   // auto = الأقرب، أو fixed + id
let here = store.get("lastPos", null);                       // آخر موقع معروف {lat, lng}
let current = null, currentWhy = "", currentDist = null;

function validTime(v) { return typeof v === "string" && /^\d{1,2}:\d{2}$/.test(v); }
function validMosque(m) {
  return m && m.id && m.name && Array.isArray(m.prayers) && m.prayers.length === 5
    && m.prayers.every(p => validTime(p.iqama)) && validTime(m.jumuah);
}
function allMosques() {
  return [
    ...baseMosques.map(m => overrides[m.id] ? { ...m, ...overrides[m.id], edited: true } : m),
    ...myMosques.map(m => ({ ...m, mine: true }))
  ];
}
// المسافة بالكيلومتر بين نقطتين
function distKm(a, b) {
  const r = x => x * Math.PI / 180, R = 6371;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtDist(km) { return km < 1 ? `${Math.round(km * 1000 / 10) * 10} م` : `${km.toFixed(1)} كم`; }
function hasPos(m) { return typeof m.lat === "number" && typeof m.lng === "number"; }
function pickMosque() {
  const list = allMosques();
  if (choice.mode === "fixed") {
    const m = list.find(x => x.id === choice.id);
    if (m) return { m, why: "fixed", d: here && hasPos(m) ? distKm(here, m) : null };
  }
  if (here) {
    let best = null;
    for (const m of list) if (hasPos(m)) {
      const d = distKm(here, m);
      if (!best || d < best.d) best = { m, d };
    }
    if (best) return { m: best.m, why: "near", d: best.d };
  }
  const last = list.find(x => x.id === store.get("lastMosque", null));
  return { m: last || list[0], why: "default", d: null };
}
// يطبّق المسجد المختار على الشاشة، ويعيد ضبط التنبيهات إن تغيّر المسجد أو أوقاته
let lastSig = null;
function applyMosque(reschedule = true) {
  const p = pickMosque();
  current = p.m; currentWhy = p.why; currentDist = p.d;
  cfg = { mosqueName: current.name, note: current.note || "", prayers: current.prayers, jumuah: current.jumuah };
  store.set("lastMosque", current.id);
  $("whereText").textContent =
    currentWhy === "near" ? `📍 الأقرب إليك · ${fmtDist(currentDist)}` :
    currentWhy === "fixed" ? "اخترته يدوياً" : "اضغط على اسم المسجد لاختيار مسجدك";
  renderNearest();
  const sig = JSON.stringify(cfg);
  render();
  if (reschedule && lastSig !== null && sig !== lastSig) scheduleAll();
  lastSig = sig;
}
// زر "أقرب مسجد إليك الآن": أقرب مسجد لموقع الجوال (حتى لو اخترت مسجدك يدوياً)، والضغط يفتح الطريق إليه في الخرائط
let nearest = null;
function renderNearest() {
  nearest = null;
  if (here) for (const m of allMosques()) if (hasPos(m)) {
    const d = distKm(here, m);
    if (!nearest || d < nearest.d) nearest = { m, d };
  }
  if (nearest) {
    $("nearName").textContent = `${nearest.m.name} · ${fmtDist(nearest.d)}`;
    $("nearGo").textContent = "الطريق ‹";
  } else {
    $("nearName").textContent = here ? "لا توجد مساجد بمواقع معروفة" : "اضغط لتحديد موقعك";
    $("nearGo").textContent = "";
  }
}
// مشاركة أوقات مسجد على واتساب (نص جاهز مع الموقع ورابط التطبيق)
function shareMosque(m) {
  const lines = m.prayers.map((p, i) => `${PRAYER_LABELS[i]}: ${fmt12(p.iqama)}`);
  lines.push(`الجمعة: ${fmt12(m.jumuah)}`);
  const text = `🕌 ${m.name} — أوقات الإقامة\n${lines.join("\n")}` +
    (hasPos(m) ? `\n📍 الموقع: https://maps.google.com/?q=${m.lat},${m.lng}` : "") +
    `\n📲 تطبيق أوقات الإقامة: https://github.com/etsbinaa-dev/masjid-iqama/releases/latest/download/masjid-iqama.apk`;
  window.location.href = "https://wa.me/?text=" + encodeURIComponent(text);
}
// يفتح تطبيق خرائط Google بالطريق مشياً إلى المسجد
function openDirections(m) {
  window.location.href = `https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lng}&travelmode=walking`;
}
$("nearBtn").onclick = () => {
  if (!nearest) { $("nearName").textContent = "جارٍ تحديد موقعك…"; locate(); return; }
  openMosquePage(nearest.m.id);
};
async function fetchGithubMosques() {
  const res = await fetch(MOSQUES_URL + "?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error("github " + res.status);
  return (await res.json()).mosques || [];
}
async function fetchSupabaseMosques() {
  const res = await fetch(`${SUPA_URL}/rest/v1/mosques?select=id,name,lat,lng,note,prayers,jumuah,updated_at`,
    { headers: { apikey: SUPA_KEY }, cache: "no-store" });
  if (!res.ok) throw new Error("supabase " + res.status);
  return await res.json();
}
// نجمع المصدرين: لكل مسجد نأخذ النسخة الأحدث تعديلاً (updated_at)
async function refreshMosques() {
  try {
    const results = await Promise.allSettled([fetchGithubMosques(), fetchSupabaseMosques()]);
    const byId = new Map();
    for (const r of results) {
      if (r.status !== "fulfilled") continue;
      for (const m of r.value) {
        if (!validMosque(m)) continue;
        const old = byId.get(m.id);
        if (!old || Date.parse(m.updated_at || 0) >= Date.parse(old.updated_at || 0)) byId.set(m.id, m);
      }
    }
    const list = [...byId.values()];
    if (!list.length) return;
    baseMosques = list; store.set("mosques", baseMosques);
    updatedAt = new Date().toISOString(); store.set("updatedAt", updatedAt);
    showUpdated(); applyMosque();
  } catch {}
}
// الموقع: نطلبه والتطبيق مفتوح فقط، ثم نختار أقرب مسجد
function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error("no geolocation"));
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
      reject, { enableHighAccuracy: false, timeout: 15000, maximumAge: 5 * 60 * 1000 });
  });
}
async function locate() {
  try {
    here = await getPosition();
    store.set("lastPos", here);
    applyMosque();
  } catch {
    if (!here) $("nearName").textContent = "فعّل الموقع (GPS) ثم اضغط هنا";
  }
}

// ---------- مشاركة المساجد مع الجميع (اقتراح يراجعه صاحب التطبيق) ----------
function deviceId() {
  let id = store.get("deviceId", null);
  if (!id) {
    id = (crypto.randomUUID && crypto.randomUUID()) ||
      "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); });
    store.set("deviceId", id);
  }
  return id;
}
async function submitSuggestion(s) {
  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/mosque_submissions`, {
      method: "POST",
      headers: { apikey: SUPA_KEY, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ ...s, device_id: deviceId() })
    });
    return res.ok;
  } catch { return false; }
}

// ---------- شاشة المساجد ----------
let sheetView = "list";
// صفحة مسجد: أوقاته والإقامة القادمة فيه، ثم زر الطريق إليه
function openMosquePage(id) { sheetView = "detail"; renderMosquePage(id); $("sheet").hidden = false; history.pushState({ sheet: true }, ""); }
function renderMosquePage(id) {
  const m = allMosques().find(x => x.id === id);
  if (!m) return;
  const now = new Date();
  const list = m.prayers.map(p => ({ ...p }));
  if (now.getDay() === 5) list[1] = { name: "الجمعة", iqama: m.jumuah };
  let nextI = list.findIndex(p => toDate(p.iqama, now) > now);
  const nextP = nextI === -1 ? list[0] : list[nextI];
  const nextT = toDate(nextP.iqama, now); if (nextI === -1) nextT.setDate(nextT.getDate() + 1);
  if (nextI === -1) nextI = 0;
  const d = here && hasPos(m) ? distKm(here, m) : null;
  const isMine = current && current.id === m.id;
  $("sheetTitle").textContent = m.name;
  $("sheetBody").innerHTML = `
    <div class="next">
      <div class="lbl">${d !== null ? "على بعد " + fmtDist(d) + " · " : ""}الإقامة القادمة</div>
      <div class="pr">${nextP.name}</div>
      <div class="tm">${fmt12(nextP.iqama)}</div>
      <div class="in">${arDuration(Math.max(0, Math.ceil((nextT - now) / 60000)))}</div>
    </div>
    <div id="mpList" style="background:var(--card);border-radius:18px;padding:4px 0">
      ${list.map((p, i) => `<div class="row ${i === nextI ? "active" : ""}"><span class="n">${p.name}</span><span class="t">${fmt12(p.iqama)}</span></div>`).join("")}
      ${now.getDay() === 5 ? "" : `<div class="row"><span class="n">الجمعة</span><span class="t">${fmt12(m.jumuah)}</span></div>`}
    </div>
    ${hasPos(m) ? '<button class="updateBar" id="mpGo">🧭 الطريق إلى المسجد</button>' : ""}
    <button class="bigBtn" id="mpShare">📤 مشاركة الأوقات على واتساب</button>
    ${isMine ? '<div class="form"><div class="msg">هذا مسجدك الحالي، وتنبيهاتك منه.</div></div>'
             : '<button class="bigBtn" id="mpChoose">اجعله مسجدي (التنبيهات منه)</button>'}`;
  if ($("mpGo")) $("mpGo").onclick = () => openDirections(m);
  $("mpShare").onclick = () => shareMosque(m);
  if ($("mpChoose")) $("mpChoose").onclick = () => chooseMosque({ mode: "fixed", id: m.id });
}
function openSheet() { sheetView = "list"; renderSheet(); $("sheet").hidden = false; history.pushState({ sheet: true }, ""); }
function closeSheet() { $("sheet").hidden = true; }
function chooseMosque(c) { choice = c; store.set("mosqueChoice", choice); applyMosque(); history.back(); }
function renderSheet() {
  const body = $("sheetBody");
  $("sheetTitle").textContent = "المساجد";
  const list = allMosques().map(m => ({ m, d: here && hasPos(m) ? distKm(here, m) : null }))
    .sort((a, b) => (a.d ?? 1e9) - (b.d ?? 1e9));
  const times = m => m.prayers.map(p => fmt12(p.iqama)).join(" · ");
  body.innerHTML = `
    <div class="mrow ${choice.mode === "auto" ? "sel" : ""}" data-auto="1">
      <div class="info"><div class="nm">📍 تلقائي: الأقرب إليّ</div>
      <div class="sub">يختار التطبيق أقرب مسجد كلما فتحته</div></div></div>
    ${list.map(({ m, d }) => `
      <div class="mrow ${choice.mode === "fixed" && choice.id === m.id ? "sel" : ""}" data-id="${escapeHtml(m.id)}">
        <div class="info">
          <div class="nm">${escapeHtml(m.name)}${m.mine ? '<span class="tag">أضفته</span>' : ""}${m.edited ? '<span class="tag">معدّل</span>' : ""}</div>
          <div class="sub">${d !== null ? fmtDist(d) + " · " : ""}${times(m)}</div>
        </div>
        ${hasPos(m) ? `<button class="edit" data-go="${escapeHtml(m.id)}" aria-label="الطريق إلى ${escapeHtml(m.name)}">🧭 الطريق</button>` : ""}
        <button class="edit" data-edit="${escapeHtml(m.id)}">تعديل</button>
      </div>`).join("")}
    <button class="bigBtn" id="addHere">+ أضف هذا المسجد (موقعي الحالي)</button>
    <div class="form"><div class="msg" id="sheetMsg"></div></div>`;
}
$("sheetBody").addEventListener("click", async e => {
  const t = e.target;
  if (t.dataset && t.dataset.edit) { e.stopPropagation(); return renderEdit(t.dataset.edit); }
  if (t.dataset && t.dataset.go) { e.stopPropagation(); const m = allMosques().find(x => x.id === t.dataset.go); if (m) openDirections(m); return; }
  if (t.id === "addHere") {
    $("sheetMsg").textContent = "جارٍ تحديد موقعك…";
    try {
      const pos = await getPosition();
      here = pos; store.set("lastPos", here);
      return renderEdit(null, pos);
    } catch {
      $("sheetMsg").textContent = "تعذّر تحديد موقعك. فعّل الموقع (GPS) واسمح للتطبيق به، ثم حاول مرة أخرى.";
      return;
    }
  }
  const row = t.closest && t.closest(".mrow");
  if (!row) return;
  if (row.dataset.auto) return chooseMosque({ mode: "auto" });
  chooseMosque({ mode: "fixed", id: row.dataset.id });
});
// شاشة التعديل: أوقات مسجد موجود، أو مسجد جديد في الموقع الحالي
function renderEdit(id, newPos) {
  sheetView = "edit";
  const m = id ? allMosques().find(x => x.id === id) : null;
  const isNew = !m, isMine = isNew || m.mine;
  const prayers = m ? m.prayers : PRAYER_LABELS.map(name => ({ name, iqama: "" }));
  const jum = m ? m.jumuah : "";
  $("sheetTitle").textContent = isNew ? "مسجد جديد" : "تعديل الأوقات";
  $("sheetBody").innerHTML = `<div class="form" style="display:flex;flex-direction:column;gap:8px">
    <label>اسم المسجد ${isMine ? `<input type="text" id="fName" value="${m ? escapeHtml(m.name) : ""}" placeholder="مثلاً: مسجد النور">` : `<b>${escapeHtml(m.name)}</b>`}</label>
    ${prayers.map((p, i) => `<label>${PRAYER_LABELS[i]}<input type="time" id="fT${i}" value="${p.iqama}"></label>`).join("")}
    <label>الجمعة<input type="time" id="fJ" value="${jum}"></label>
    ${isMine ? `<label>الموقع<input type="text" id="fPos" inputmode="decimal" dir="ltr" placeholder="18.131270,-15.963919"
        value="${m && hasPos(m) ? m.lat + "," + m.lng : (newPos ? newPos.lat.toFixed(6) + "," + newPos.lng.toFixed(6) : "")}"></label>
      <button class="bigBtn" id="fHere" type="button">📍 استعمل موقعي الحالي</button>` : ""}
    <label>شارك مع الجميع (بعد المراجعة)<input type="checkbox" id="fShare" checked></label>
    <button class="bigBtn" id="fSave">حفظ</button>
    ${!isNew && m.edited ? '<button class="bigBtn" id="fReset">الرجوع للأوقات الأصلية</button>' : ""}
    ${!isNew && m.mine ? '<button class="bigBtn danger" id="fDelete">حذف هذا المسجد</button>' : ""}
    <div class="msg" id="fMsg">يُحفظ على جوالك مباشرة. وإن اخترت المشاركة، يُرسل اسم المسجد وموقعه وأوقاته فقط (دون أي معلومات عنك) ليُراجَع ثم يظهر للجميع.</div>
  </div>`;
  const pad = v => v.length === 4 ? "0" + v : v;
  if ($("fHere")) $("fHere").onclick = async () => {
    $("fMsg").textContent = "جارٍ تحديد موقعك…";
    try { const p = await getPosition(); $("fPos").value = p.lat.toFixed(6) + "," + p.lng.toFixed(6); $("fMsg").textContent = "تم أخذ موقعك الحالي. اضغط حفظ."; }
    catch { $("fMsg").textContent = "تعذّر تحديد موقعك. فعّل الموقع (GPS)، أو الصق الإحداثيات من خرائط Google."; }
  };
  // يقبل "18.131270,-15.963919" (بفاصلة أو مسافة)
  const parsePos = v => {
    const mm = String(v || "").trim().match(/^(-?\d+(?:\.\d+)?)\s*[,،\s]\s*(-?\d+(?:\.\d+)?)$/);
    if (!mm) return null;
    const lat = +mm[1], lng = +mm[2];
    return Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? { lat, lng } : null;
  };
  $("fSave").onclick = async () => {
    const vals = PRAYER_LABELS.map((_, i) => $("fT" + i).value);
    const j = $("fJ").value;
    const name = isMine ? $("fName").value.trim() : m.name;
    if (!name) { $("fMsg").textContent = "اكتب اسم المسجد."; return; }
    if (!vals.every(validTime) || !validTime(j)) { $("fMsg").textContent = "أكمل كل الأوقات قبل الحفظ."; return; }
    const ps = PRAYER_LABELS.map((n, i) => ({ name: n, iqama: pad(vals[i]) }));
    const pos = isMine ? parsePos($("fPos").value) : null;
    if (isMine && !pos) { $("fMsg").textContent = "اكتب الموقع بهذا الشكل: 18.131270,-15.963919 أو اضغط «استعمل موقعي الحالي»."; return; }
    if (isNew) {
      const nm = { id: "u" + Date.now(), name, lat: pos.lat, lng: pos.lng, note: "", prayers: ps, jumuah: pad(j) };
      myMosques.push(nm);
    } else if (m.mine) {
      myMosques = myMosques.map(x => x.id === m.id ? { ...x, name, lat: pos.lat, lng: pos.lng, prayers: ps, jumuah: pad(j) } : x);
    } else {
      overrides[m.id] = { prayers: ps, jumuah: pad(j) };
      store.set("overrides", overrides);
    }
    store.set("myMosques", myMosques);
    let shareMsg = "";
    if ($("fShare").checked) {
      $("fSave").disabled = true; $("fMsg").textContent = "جارٍ الإرسال…";
      const target = isNew ? myMosques[myMosques.length - 1] : (m.mine ? myMosques.find(x => x.id === m.id) : null);
      const sub = target
        ? { kind: "new", name, lat: target.lat, lng: target.lng, prayers: ps, jumuah: pad(j) }
        : { kind: "times", mosque_id: m.id, name: m.name, prayers: ps, jumuah: pad(j) };
      shareMsg = (await submitSuggestion(sub))
        ? "شكراً، أُرسل للمراجعة وسيظهر للجميع بعد اعتماده."
        : "حُفظ على جوالك، لكن تعذّر الإرسال للمراجعة (تحقق من الإنترنت وأعد الحفظ لاحقاً).";
    }
    applyMosque(); sheetView = "list"; renderSheet();
    if (shareMsg) $("sheetMsg").textContent = shareMsg;
  };
  if ($("fReset")) $("fReset").onclick = () => { delete overrides[m.id]; store.set("overrides", overrides); applyMosque(); sheetView = "list"; renderSheet(); };
  if ($("fDelete")) $("fDelete").onclick = () => {
    myMosques = myMosques.filter(x => x.id !== m.id); store.set("myMosques", myMosques);
    if (choice.mode === "fixed" && choice.id === m.id) { choice = { mode: "auto" }; store.set("mosqueChoice", choice); }
    applyMosque(); sheetView = "list"; renderSheet();
  };
}

// ---------- التنبيهات ----------
// وقت التنبيه = وقت الإقامة ناقص عدد الدقائق المختار
function minus(hhmm, mins) {
  const [h, m] = hhmm.split(":").map(Number);
  const t = ((h * 60 + m - mins) % 1440 + 1440) % 1440;
  return { hour: Math.floor(t / 60), minute: t % 60 };
}
const minsWord = n => n <= 10 ? `${n} دقائق` : `${n} دقيقة`;
function buildAlarms() {
  const items = [];
  const key = { "الفجر": "fajr", "الظهر": "dhuhr", "العصر": "asr", "المغرب": "maghrib", "العشاء": "isha", "الجمعة": "jumuah" };
  const add = (id, name, iqama, weekday) => {
    const n = settings.perMin[key[name] || "fajr"] || 10;
    const at = minus(iqama, n);
    items.push({
      id, hour: at.hour, minute: at.minute, weekday: weekday || 0,
      sound: settings.sound,
      title: `إقامة ${name} بعد ${minsWord(n)}`,
      body: `${cfg.mosqueName} — الإقامة ${fmt12(iqama)}`
    });
  };
  const [fajr, dhuhr, asr, maghrib, isha] = cfg.prayers;
  const on = settings.prayers;
  if (on.fajr) add(1, "الفجر", fajr.iqama);
  if (on.asr) add(3, "العصر", asr.iqama);
  if (on.maghrib) add(4, "المغرب", maghrib.iqama);
  if (on.isha) add(5, "العشاء", isha.iqama);
  // الظهر كل الأيام عدا الجمعة (1=الأحد ... 6=الجمعة، 7=السبت)
  if (on.dhuhr) [1, 2, 3, 4, 5, 7].forEach(d => add(20 + d, "الظهر", dhuhr.iqama, d));
  if (on.jumuah) add(26, "الجمعة", cfg.jumuah, 6);
  return items;
}

// نظام التنبيه الخاص بالتطبيق (كود أندرويد): يشغّل "حي على الصلاة" على صوت المنبّه فيُسمع في الوضع الصامت.
const Alarm = Notif ? window.Capacitor.registerPlugin("IqamaAlarm") : null;

// تنظيف ما بقي من النسخ القديمة: تنبيهاتها المجدولة وقنواتها
async function cleanupOld() {
  try {
    const pending = await Notif.getPending();
    if (pending.notifications.length) {
      await Notif.cancel({ notifications: pending.notifications.map(x => ({ id: x.id })) });
    }
  } catch {}
  for (const old of ["iqama", "iqama_sound", "iqama_hayya", "iqama_alarm"]) {
    try { await Notif.deleteChannel({ id: old }); } catch {}
  }
}
// تذكير الأذكار: بعد إقامة الفجر (الصباح) والعصر (المساء) بنصف ساعة
async function scheduleAdhkarReminders() {
  if (!Notif) return;
  try { await Notif.cancel({ notifications: [{ id: 901 }, { id: 902 }, { id: 903 }] }); } catch {}
  if (settings.fridayRemind) {
    try { await Notif.createChannel({ id: "adhkar", name: "تذكير الأذكار", importance: 3, visibility: 1 }); } catch {}
    // الجمعة (6) الساعة 9 صباحاً
    await Notif.schedule({ notifications: [{ id: 903, channelId: "adhkar", title: "يوم الجمعة",
      body: "اضغط لقراءة سورة الكهف، وأكثِر من الصلاة على النبي ﷺ", smallIcon: "ic_stat_iqama", extra: { sec: "kahf" },
      schedule: { on: { weekday: 6, hour: 9, minute: 0 }, allowWhileIdle: true } }] });
  }
  if (!settings.adhkarRemind) return;
  try { await Notif.createChannel({ id: "adhkar", name: "تذكير الأذكار", importance: 3, visibility: 1 }); } catch {}
  const at = (hhmm) => minus(hhmm, -30);
  const mk = (id, sec, title, hhmm) => ({ id, channelId: "adhkar", title, body: "اضغط لقراءتها",
    smallIcon: "ic_stat_iqama", extra: { sec }, schedule: { on: at(hhmm), allowWhileIdle: true } });
  await Notif.schedule({ notifications: [
    mk(901, "morning", "حان وقت أذكار الصباح", cfg.prayers[0].iqama),
    mk(902, "evening", "حان وقت أذكار المساء", cfg.prayers[2].iqama)
  ] });
}
async function askPermission() {
  let perm = await Notif.checkPermissions();
  if (perm.display !== "granted") perm = await Notif.requestPermissions();
  return perm.display === "granted";
}
async function scheduleAll() {
  if (!Alarm) { $("notifyStatus").textContent = "التنبيهات تعمل داخل تطبيق الجوال فقط."; return; }
  try {
    await cleanupOld();
    if (!settings.on) {
      await Alarm.cancelAll();
      $("notifyStatus").textContent = "التنبيه متوقف.";
      $("settingsSummary").textContent = "⚙ الإعدادات (التنبيه متوقف)";
      try { await scheduleAdhkarReminders(); } catch {}
      return;
    }
    // الصوت يعمل حتى دون إذن الإشعارات، لكن الإشعار المكتوب يحتاجه
    const granted = await askPermission();
    await Alarm.schedule({ alarms: buildAlarms() });
    try { await scheduleAdhkarReminders(); } catch {}
    if (granted) {
      $("notifyStatus").textContent = "سيرنّ التطبيق قبل كل إقامة حسب الدقائق المختارة، حتى في الوضع الصامت.";
    } else {
      $("settingsBox").open = true;
      $("notifyStatus").textContent = "سيرنّ الصوت، لكن الإشعار المكتوب لن يظهر لأنك لم تسمح بالإشعارات. فعّلها من إعدادات الجوال ← التطبيقات ← أوقات الإقامة ← الإشعارات.";
    }
    $("settingsSummary").textContent = "⚙ الإعدادات";
    try {
      const exact = await Notif.checkExactNotificationSetting();
      $("exactBtn").hidden = exact.exact_alarm === "granted";
    } catch {}
  } catch (e) {
    $("notifyStatus").textContent = "تعذّر ضبط التنبيهات. أغلق التطبيق وافتحه مرة أخرى.";
  }
}

// ---------- الأذكار: الصباح والمساء والنوم ----------
// اضغط على الذكر ليُنقص العدد حتى يكتمل. تقدّم كل قسم يُحفظ لليوم نفسه ويبدأ من جديد في اليوم التالي.
const SECTION_TITLES = { morning: "أذكار الصباح", evening: "أذكار المساء", sleep: "أذكار النوم" };
let allAdhkar = null;
let section = "evening";
let adhkar = [];
const todayKey = () => new Date().toDateString();
function loadDone() {
  const saved = store.get("adhkarDone_" + section, null);
  return saved && saved.day === todayKey() ? saved.counts : {};
}
let done = {};
function saveDone() { store.set("adhkarDone_" + section, { day: todayKey(), counts: done }); }
let page = 0;
function leftOf(i) { return adhkar[i].n - Math.min(done[i] || 0, adhkar[i].n); }
function renderAdhkar() {
  if ((store.get("adhkarDone_" + section, {}) || {}).day !== todayKey()) done = {};
  if (!adhkar.length) { $("dhikrText").textContent = "تعذّر تحميل الأذكار."; return; }
  page = Math.max(0, Math.min(page, adhkar.length - 1));
  const d = adhkar[page], left = leftOf(page);
  $("dhikrTitle").textContent = `${page + 1} من ${adhkar.length}${d.t ? " · " + d.t : ""}`;
  $("dhikrText").innerHTML = formatDhikr(d.x);
  fitText();

  $("dhikrLeft").textContent = left ? left : "✓";
  $("dhikrLabel").textContent = left ? (d.n > 1 ? "متبقي" : "مرة") : "تمّ";
  $("dhikrCard").classList.toggle("done", !left);
  $("dhikrPrev").disabled = page === 0;
  $("dhikrNext").textContent = page === adhkar.length - 1 ? "انتهت الأذكار" : "التالي";
  $("dhikrNext").disabled = page === adhkar.length - 1;
  const finished = adhkar.filter((_, i) => !leftOf(i)).length;
  $("adhkarProgress").textContent = `أكملت ${finished} من ${adhkar.length}`;
}
// تنسيق النص: كل سطر في فقرة، البسملة والاستعاذة بالذهبي، وأرقام الآيات بالذهبي
const LEAD_LINES = ["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ", "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ"];
function escapeHtml(t) { return t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function formatDhikr(text) {
  return text.split("\n").map(line => {
    if (!line.trim()) return '<div class="gap"></div>';
    const html = escapeHtml(line).replace(/﴿[^﴾]*﴾/g, m => `<span class="an">${m}</span>`);
    return `<p class="${LEAD_LINES.includes(line.trim()) ? "lead" : ""}">${html}</p>`;
  }).join("");
}
// حجم خط واحد لكل الأذكار، يُحفظ ويُغيَّر بزرّي + و −
const ZOOM_MIN = 18, ZOOM_MAX = 44;
if (!settings.adhkarPx) settings.adhkarPx = 26;
function fitText() {
  const el = $("dhikrText");
  el.style.fontSize = settings.adhkarPx + "px";
  el.scrollTop = 0;
  $("zoomOut").style.opacity = settings.adhkarPx <= ZOOM_MIN ? .35 : 1;
  $("zoomIn").style.opacity = settings.adhkarPx >= ZOOM_MAX ? .35 : 1;
}
function zoom(step, e) {
  e.stopPropagation();   // حتى لا يُحسب الضغط عدّاً للذكر
  settings.adhkarPx = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, settings.adhkarPx + step));
  store.set("settings", settings);
  fitText();
}
$("zoomIn").onclick = e => zoom(2, e);
$("zoomOut").onclick = e => zoom(-2, e);
window.addEventListener("resize", fitText);
// بعد تحميل الخط نعيد الضبط لأن مقاسه يختلف عن الخط الاحتياطي
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitText);
if (document.fonts) document.fonts.addEventListener && document.fonts.addEventListener("loadingdone", fitText);
function goTo(i) {
  if (i < 0 || i >= adhkar.length) return;
  page = i; store.set("adhkarPage_" + section, { day: todayKey(), page });
  renderAdhkar();
}
let advanceTimer = null;
$("dhikrCard").addEventListener("click", () => {
  if (!leftOf(page)) return;
  done[page] = (done[page] || 0) + 1; saveDone(); renderAdhkar();
  const finishedNow = !leftOf(page);
  try { navigator.vibrate && navigator.vibrate(finishedNow ? 60 : 15); } catch {}
  // عند اكتمال العدد ننتقل وحدنا إلى الذكر التالي
  if (finishedNow && page < adhkar.length - 1) {
    clearTimeout(advanceTimer);
    const from = page;
    advanceTimer = setTimeout(() => { if (page === from) goTo(page + 1); }, 700);
  }
});
$("dhikrPrev").onclick = () => goTo(page - 1);
$("dhikrNext").onclick = () => goTo(page + 1);
// السحب بالإصبع: نحو اليمين للتالي، ونحو اليسار للسابق (اتجاه الصفحات العربية)
let touchX = null;
$("dhikrCard").addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
$("dhikrCard").addEventListener("touchend", e => {

  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 60) { e.preventDefault(); goTo(page + (dx > 0 ? 1 : -1)); }
});

// ---------- رقم النسخة والتحديث ----------
// version.json يكتبه البناء التلقائي: رقم النسخة ومستوى النظام الداخلي الذي تحتاجه هذه الواجهة.
// تحديث الواجهة: ينزل تلقائياً في الخلفية ويُطبَّق في الفتحة التالية (أداة Capgo، من GitHub مباشرة، دون أي إحصاءات).
// تحديث النظام الداخلي (كود أندرويد): يظهر شريط ذهبي لتنزيل ملف التطبيق يدوياً.
const APK_URL = "https://github.com/etsbinaa-dev/masjid-iqama/releases/latest/download/masjid-iqama.apk";
const Updater = Alarm ? window.Capacitor.registerPlugin("CapacitorUpdater") : null;
// نخبر الأداة أن هذه الواجهة تعمل؛ وإلا ترجع وحدها إلى النسخة السابقة
if (Updater) { try { Updater.notifyAppReady(); } catch {} }
let appVersion = 0;
async function nativeLevel() {
  // اسم نسخة التطبيق مثل "2.25": الرقم الأول هو مستوى النظام الداخلي. النسخ القديمة بلا أداة التحديث = 1
  if (!Updater) return 1;
  try { return parseInt(String((await Updater.current()).native).split(".")[0], 10) || 1; } catch { return 1; }
}
// آخر نسخة منشورة: أولاً من ملف latest.json (نفس عنوان قائمة المساجد، وهو الأثبت)، ثم من واجهة GitHub احتياطاً
const LATEST_URL = "https://raw.githubusercontent.com/etsbinaa-dev/masjid-iqama/main/latest.json";
async function fetchJson(url, tries = 2) {
  let err;
  for (let i = 0; i < tries; i++) {
    try {
      const res = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    } catch (e) { err = e; await new Promise(r => setTimeout(r, 1500)); }
  }
  throw err;
}
async function latestRelease() {
  try {
    const j = await fetchJson(LATEST_URL);
    if (j && j.version) return { version: +j.version, native: +j.native || 1, webUrl: j.web || null };
  } catch {}
  const rel = await fetchJson("https://api.github.com/repos/etsbinaa-dev/masjid-iqama/releases/latest");
  const web = (rel.assets || []).map(a => ({ a, m: /^web-n(\d+)\.zip$/.exec(a.name) })).find(x => x.m);
  return { version: parseInt(String(rel.tag_name || "").replace(/\D/g, ""), 10),
           native: web ? parseInt(web.m[1], 10) : 99, webUrl: web ? web.a.browser_download_url : null };
}
// سطر صغير يبيّن حالة التحديث تحت رقم النسخة (ويساعد على معرفة سبب أي مشكلة)
function otaStatus(t) { $("otaStatus").textContent = t; }
async function checkUpdate() {
  let step = "قراءة رقم النسخة";
  try {
    appVersion = (await (await fetch("version.json", { cache: "no-store" })).json()).version || 0;
    if (appVersion) $("version").textContent = `النسخة ${appVersion}`;
    if (!appVersion || !Alarm) return;            // لا تحديث خارج تطبيق الجوال
    step = "السؤال عن آخر نسخة";
    const info = await latestRelease();
    const latest = info.version;
    if (!(latest > appVersion)) { otaStatus("التطبيق محدّث"); return; }
    const web = info.webUrl ? { url: info.webUrl, native: info.native } : null;
    step = "معرفة النظام الداخلي";
    const myNative = await nativeLevel();
    if (Updater && web && web.native <= myNative) {
      const v = String(latest);
      step = "البحث عن تنزيل سابق";
      const bundles = ((await Updater.list()) || {}).bundles || [];
      let bundle = bundles.find(b => b.version === v && b.status === "success");
      // محاولة سابقة فاشلة لنفس النسخة: نحذفها ثم نعيد التنزيل
      for (const b of bundles) if (b.version === v && b.status !== "success") { try { await Updater.delete({ id: b.id }); } catch {} }
      if (!bundle) {
        step = "تنزيل التحديث";
        otaStatus(`جارٍ تنزيل التحديث ${latest}…`);
        bundle = await Updater.download({ url: web.url, version: v });
      }
      step = "تجهيز التحديث";
      await Updater.next({ id: bundle.id });   // يُطبَّق حين يُغلق التطبيق أو يُرسَل للخلفية
      otaStatus(`التحديث ${latest} جاهز — أغلق التطبيق وافتحه`);
      return;
    }
    // يحتاج نظاماً داخلياً أحدث: تنزيل ملف التطبيق
    otaStatus("");
    $("updateBar").textContent = `تحديث مهم للتطبيق (${latest}) — اضغط للتنزيل`;
    $("updateBar").hidden = false;
  } catch (e) {
    otaStatus(`تعذّر التحديث (${step}): ${(e && (e.message || e.code)) || e}`.slice(0, 160));
  }
}
// يفتح رابط التحميل في المتصفح، ثم يفتح الشخص الملف ويضغط "تثبيت"
$("updateBar").onclick = () => { window.location.href = APK_URL; };

showUpdated();
applyMosque(false);
setInterval(render, 1000);
scheduleAll();
refreshMosques();
locate();
checkUpdate();
document.addEventListener("visibilitychange", () => { if (!document.hidden) { refreshMosques(); locate(); } });
</script>
</body>
</html>
